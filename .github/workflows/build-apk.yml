name: Build APK

on:
  push:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MagnetPlayer-apk
          path: app/build/outputs/apk/release/*.apk

      # Publishes the APK as a plain file on the Releases page, so this link always gives the newest version:
      # https://github.com/<owner>/<repo>/releases/latest/download/MagnetPlayer.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          cp "$APK" MagnetPlayer.apk
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          TAG="v$VER"
          echo "Tag: $TAG"
          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" MagnetPlayer.apk --clobber
            else
              gh release create "$TAG" MagnetPlayer.apk --title "Magnet Player $VER" \
                --notes "Magnet Player for Android TV, version $VER. Download MagnetPlayer.apk below and install it on your TV." \
                --latest --target "$GITHUB_SHA"
            fi
          }
          if ! OUT=$(publish 2>&1); then
            echo "$OUT"
            echo "::error title=Publish failed::$(echo "$OUT" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "$OUT"
